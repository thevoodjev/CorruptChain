<?xml version="1.0" encoding="UTF-8"?>
<!--
  corruptchain logo. Wordmark with a mark that is a literal diagram of the core
  data structure: a chain of dependency blocks in which one block is corrupted
  and passes its state to the block after it. Three blocks, the middle filled in
  the accent, an arrow from it to the last block, showing taint flowing forward.

  Palette reason, matching the diagram asset:
    core ink   #1f2933 on #ffffff, contrast 13.9:1, wordmark and clean blocks.
    accent     #b23a1e, the single corrupted block, the thing seen first.
  One stroke width per role: block border 1.5, connector 1. Corner radius 4.
  Geometry on whole pixels. No blur, no gradient, no metaphor scenery.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img"
     aria-labelledby="lg-title lg-desc" width="240" height="240">
  <title id="lg-title">corruptchain</title>
  <desc id="lg-desc">Three chained blocks read left to right. The first is clean,
    the middle block is filled in the accent colour to mark it corrupted, and a
    short arrow carries its state to the third block, which is also marked
    corrupted. Below sits the wordmark corruptchain, with corrupt in the accent
    and chain in the core ink.</desc>

  <rect x="0" y="0" width="240" height="240" fill="#ffffff"/>

  <!-- Chain of three blocks, centred. Each block 48 wide, gap 16, on y 72. -->
  <!-- Connectors first. -->
  <g stroke="#1f2933" stroke-width="1" fill="none">
    <path d="M 72 96 L 88 96"/>    <!-- block1 -> block2 -->
    <path d="M 136 96 L 152 96"/>  <!-- block2 -> block3 -->
  </g>
  <g fill="#1f2933">
    <path d="M 88 96 l -8 -4 l 0 8 z"/>
  </g>
